services:
  servicesignal:
    build: .
    ports:
      - "127.0.0.1:8017:8017"
    volumes:
      - signal-data:/app/data
    environment:
      SERVICESIGNAL_MODE: ${SERVICESIGNAL_MODE:-demo}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-fixture}
      AGENT_MODEL_ID: ${AGENT_MODEL_ID:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8017}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
volumes:
  signal-data:

[project]
name = "servicesignal"
version = "0.1.0"
description = "Source-confirmed community notices, from change to verified publication."
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "strands-agents[anthropic,openai]>=1.0,<2", "pydantic>=2.10,<3",
  "pypdf>=5,<7", "reportlab>=4.3,<5", "qrcode>=8,<9", "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "beautifulsoup4>=4.13,<5", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">ServiceSignal architecture</title><desc id="desc">A coordinator uses FastAPI and a read-only Strands agent. Exact approval queues durable work in SQLite. A separate worker publishes over HTTP and reads the resident page back, with reminders, expiry, and drift checks.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#6a8661"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#243c35}.title{font-size:29px;font-weight:bold}.sub{font-size:15px;fill:#63715e}.box{fill:#fff;stroke:#c6d4ba;stroke-width:2;rx:12}.label{font-size:19px;font-weight:bold}.small{font-size:14px;fill:#617257}.line{fill:none;stroke:#6a8661;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1200" height="700" rx="20" fill="#f5f7ed"/><text x="48" y="60" class="title">ServiceSignal · From source to checked publication</text><text x="48" y="91" class="sub">The agent interprets. The coordinator confirms. Application code enforces authority.</text><rect x="45" y="145" width="235" height="110" class="box"/><text x="68" y="184" class="label">Coordinator browser</text><text x="68" y="211" class="small">Source → facts → exact approval</text><text x="68" y="235" class="small">Isolated fictional workspace</text><rect x="367" y="145" width="235" height="110" class="box"/><text x="390" y="184" class="label">FastAPI application</text><text x="390" y="211" class="small">Validation + session isolation</text><text x="390" y="235" class="small">Immutable approval plan hash</text><rect x="710" y="145" width="435" height="110" class="box"/><text x="735" y="183" class="label">Strands agent · Bedrock / Anthropic</text><text x="735" y="211" class="small">Read-only source and program tools → typed proposal</text><text x="735" y="235" class="small">No publisher secret, write tool, or arbitrary URL access</text><path d="M280 200h85" class="line"/><path d="M602 183h105" class="line"/><path d="M710 221H606" class="line"/><rect x="367" y="330" width="235" height="115" class="box"/><text x="390" y="371" class="label">Persistent SQLite WAL</text><text x="390" y="399" class="small">Approval + jobs in one transaction</text><text x="390" y="423" class="small">Revisions, evidence, activity</text><path d="M484 255v72" class="line"/><text x="505" y="299" class="small">durable outbox</text><rect x="45" y="330" width="235" height="115" class="box"/><text x="68" y="371" class="label">Separate worker</text><text x="68" y="399" class="small">Leases, retries, deduplication</text><text x="68" y="423" class="small">Reminder, expiry, drift checks</text><path d="M367 386h-84" class="line"/><rect x="367" y="525" width="235" height="110" class="box"/><text x="390" y="564" class="label">Controlled publisher</text><text x="390" y="592" class="small">Secret + active lease + approval</text><text x="390" y="616" class="small">Idempotent, version-checked write</text><path d="M161 445v135h203" class="line"/><text x="49" y="489" class="small">authorized HTTP write</text><path d="M484 525v-77" class="line"/><rect x="710" y="525" width="435" height="110" class="box"/><text x="735" y="564" class="label">Resident notice · HTML / PDF / QR</text><text x="735" y="592" class="small">Public approved projection. No resident account needed.</text><text x="735" y="616" class="small">Expired arrangements display an approved fallback.</text><path d="M602 387h326v135" class="line"/><path d="M161 330v-42h975v234" class="line"/><text x="735" y="310" class="small">Worker makes a separate HTTP read of visible page facts</text><rect x="730" y="355" width="390" height="95" rx="10" fill="#f8edd6" stroke="#e6d4ac"/><text x="752" y="388" class="label">Explicitly outside live publication</text><text x="752" y="414" class="small">Partner simulator + manual print replacement tasks</text><text x="752" y="437" class="small">Never labeled as verified external integration</text><text x="48" y="675" class="small">One persistent host · one API/worker pair · fictional data · live model access requires account authorization</text></svg>
